<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a103c" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.65; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes dataFlow {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shimmerBar {
      0% { width: 40px; }
      50% { width: 140px; }
      100% { width: 40px; }
    }
    .orb-anim { animation: pulseOrb 8s ease-in-out infinite; transform-origin: center; }
    .float-1 { animation: floatPill1 5s ease-in-out infinite; }
    .float-2 { animation: floatPill2 6.5s ease-in-out infinite; }
    .float-3 { animation: floatPill3 5.5s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8 6; animation: dataFlow 3s linear infinite; }
    .shimmer { animation: shimmerBar 4s ease-in-out infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="338" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <g class="orb-anim" opacity="0.4">
    <circle cx="150" cy="80" r="130" fill="url(#glowGrad)" />
    <circle cx="1060" cy="180" r="160" fill="#6366f1" filter="url(#subtleGlow)" opacity="0.25" />
    <circle cx="650" cy="300" r="110" fill="#38bdf8" filter="url(#subtleGlow)" opacity="0.15" />
  </g>

  <!-- Subtle Background Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="68" x2="1200" y2="68" />
    <line x1="0" y1="136" x2="1200" y2="136" />
    <line x1="0" y1="204" x2="1200" y2="204" />
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Right-Hand Dynamic Background Graphic Cards (Behind Foreground Text) -->
  <!-- Dynamic Connection Flow Line -->
  <path d="M 850,75 C 920,75 900,165 960,165 S 1020,250 1100,250" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" class="flow-line" />

  <!-- Floating Dynamic Pill 1 (CPQ Engine) -->
  <g class="float-1" transform="translate(820, 48)">
    <rect width="210" height="52" rx="12" fill="url(#cardGrad1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="28" cy="26" r="12" fill="rgba(56, 189, 248, 0.18)" />
    <text x="28" y="31" font-size="14" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">⚡</text>
    <text x="50" y="24" font-size="13" font-weight="700" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">CPQ &amp; Logic Engine</text>
    <text x="50" y="40" font-size="11" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Dynamic Rules &amp; BOM</text>
  </g>

  <!-- Floating Dynamic Pill 2 (Price Books & Waterfall) -->
  <g class="float-2" transform="translate(930, 138)">
    <rect width="230" height="56" rx="12" fill="url(#cardGrad1)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="28" cy="28" r="12" fill="rgba(129, 140, 248, 0.18)" />
    <text x="28" y="33" font-size="14" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">💎</text>
    <text x="50" y="25" font-size="13" font-weight="700" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Multi-Tier Price Books</text>
    <text x="50" y="42" font-size="11" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Volume, Tiered &amp; Overage</text>
  </g>

  <!-- Floating Dynamic Pill 3 (Real-Time Metering) -->
  <g class="float-3" transform="translate(860, 226)">
    <rect width="220" height="52" rx="12" fill="url(#cardGrad1)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="28" cy="26" r="12" fill="rgba(192, 132, 252, 0.18)" />
    <text x="28" y="31" font-size="14" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">📊</text>
    <text x="50" y="24" font-size="13" font-weight="700" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Usage &amp; Metering</text>
    <text x="50" y="40" font-size="11" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Event Ingestion &amp; Rating</text>
  </g>

  <!-- Top Decorative Accent Shimmer Line -->
  <rect x="70" y="38" height="3" rx="1.5" fill="url(#accentGrad)" class="shimmer" />

  <!-- FOREGROUND CONTENT: Title, Subtitle, Badges -->
  <!-- Category Tag -->
  <g transform="translate(70, 56)">
    <rect width="180" height="26" rx="13" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#38bdf8" />
    <text x="26" y="17" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">CURATED DIRECTORY</text>
  </g>

  <!-- Main Title (Strictly Foreground) -->
  <text x="70" y="132" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
    Awesome Product &amp; Pricing
  </text>
  <text x="70" y="180" font-size="38" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
    Catalog Management
  </text>

  <!-- Subtitle (Strictly Foreground) -->
  <text x="70" y="222" font-size="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    CPQ Platforms • Dynamic Price Books • Billing Engines • Open-Source PIM Foundations
  </text>

  <!-- Bottom Metric / Architecture Pills -->
  <g transform="translate(70, 260)">
    <!-- Pill 1 -->
    <rect width="130" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="65" y="20" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">🛍️ Product Masters</text>

    <!-- Pill 2 -->
    <rect x="142" y="0" width="135" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="209" y="20" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">🏷️ Pricing Rules</text>

    <!-- Pill 3 -->
    <rect x="289" y="0" width="120" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="349" y="20" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">⚙️ CPQ Engines</text>

    <!-- Pill 4 -->
    <rect x="421" y="0" width="130" height="30" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="486" y="20" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">📈 Usage Rating</text>
  </g>
</svg>
